<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dodola — Kirish</title><link rel="stylesheet" href="css/customer-account.css"></head><body class="auth-body"><main class="auth-shell"><section class="auth-card"><a class="auth-brand" href="index.html"><span class="auth-mark">SM</span><span>Sale Market</span></a><h1>Kirish va ro‘yxatdan o‘tish</h1><p>Admin yoki mijoz ma’lumotlaringiz bilan xavfsiz kiring.</p><div class="auth-tabs"><button id="loginTab" class="active">Kirish</button><button id="registerTab">Ro‘yxatdan o‘tish</button></div>
<form id="loginForm" class="auth-form"><div class="auth-field"><label for="identifier">Telefon raqami yoki admin logini</label><input id="identifier" autocomplete="username" required></div><div class="auth-field"><label for="loginPassword">Parol</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button class="auth-btn">Kirish</button><button id="forgotBtn" class="auth-link" type="button">Parolni unutdingizmi?</button></form>
<form id="registerForm" class="auth-form hidden"><div class="auth-field"><label>Ism</label><input name="firstName" required maxlength="80"></div><div class="auth-field"><label>Familiya</label><input name="lastName" required maxlength="80"></div><div class="auth-field"><label>Telefon</label><input name="phone" placeholder="+998901234567" required></div><div class="auth-field"><label>Email</label><input name="email" type="email" required></div><div class="auth-field"><label>Parol</label><input name="password" type="password" minlength="10" required></div><div class="auth-field"><label>Parolni takrorlang</label><input name="confirmPassword" type="password" minlength="10" required></div><button class="auth-btn">Hisob yaratish</button></form>
<form id="forgotForm" class="auth-form hidden"><h2>Parolni tiklash</h2><div class="auth-field"><label>Email</label><input name="email" type="email" required></div><button class="auth-btn">Tiklash havolasini yuborish</button><button id="backLogin" class="auth-link" type="button">Kirishga qaytish</button></form><div id="authMessage" class="auth-message" role="status"></div></section></main><script src="js/auth-page.js"></script></body></html>
