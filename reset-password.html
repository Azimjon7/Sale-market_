<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parolni tiklash</title><link rel="stylesheet" href="css/customer-account.css"></head><body class="auth-body"><main class="auth-shell"><section class="auth-card"><a class="auth-brand" href="index.html"><span class="auth-mark">SM</span>Sale Market</a><h1>Yangi parol</h1><form id="resetForm" class="auth-form"><div class="auth-field"><label>Yangi parol</label><input name="password" type="password" minlength="10" required></div><div class="auth-field"><label>Parolni takrorlang</label><input name="confirmPassword" type="password" minlength="10" required></div><button class="auth-btn">Parolni yangilash</button></form><div id="authMessage" class="auth-message"></div></section></main><script>let csrf='';(async()=>{csrf=(await(await fetch('/api/auth/session')).json()).csrfToken})();document.getElementById('resetForm').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));body.token=new URLSearchParams(location.search).get('token')||'';const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(body)}),d=await r.json();document.getElementById('authMessage').textContent=d.message;if(r.ok)setTimeout(()=>location.href='auth.html',1200)};</script></body></html>
